name: buildAndroid

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  buildAndroid:
    name: buildAndroid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Setup Java JDK
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5

      - name: Restore Previous Cache
        id: cache-debug-build-android-restore
        uses: actions/cache/restore@main
        with:
          path: |
            ~/haxelib
            ~/.gradle
            export/release/android/haxe
            export/release/android/obj
          key: cache-android-build

      - name: Install Dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install flixel 5.5.0 --quiet
          haxelib install flixel-addons 3.0.2 --quiet
          haxelib install flixel-ui 2.5.0 --quiet
          haxelib install flixel-tools 1.5.1 --quiet
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.2.0 --quiet
          haxelib install hscript 2.5.0 --quiet
          haxelib install tjson --quiet
          haxelib install hxcpp-debug-server --quiet
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp master
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate dev
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit
          haxelib git hxdiscord_rpc https://github.com/MAJigsaw77/hxdiscord_rpc
          haxelib git extension-androidtools https://github.com/NaysLastPlay77/extension-androidtools
          haxelib git extension-orientation https://github.com/HaxeExtension/extension-orientation.git
          haxelib git androiddialogs https://github.com/beihu235/AndroidDialogs
          haxelib git devicelanguage https://github.com/beihu235/devicelanguage
          haxelib git sscript https://github.com/Sirox-Dev/sscript

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          haxelib list
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Building
        run: haxelib run lime build android -${{ matrix.arch }}
        env:
          cert_pass: nullfunni
          cert_alias_pass: nullfunni

      - name: Save Current Cache
        id: cache-release-build-android-save
        uses: actions/cache/save@main
        with:
          path: |
            ~/haxelib
            ~/.gradle
            export/release/android/haxe
            export/release/android/obj
          key: cache-android-build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaFlare-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
